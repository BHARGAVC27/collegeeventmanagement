services:
  db:
    image: mysql:8.0
    container_name: college_event_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: college_event_management
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: always

volumes:
  db_data:
